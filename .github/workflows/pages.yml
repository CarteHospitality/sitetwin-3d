# The static demo on GitHub Pages: the viewer folder as it is in the repository (sample sites only;
# real site files live in git-ignored folders and never reach it). Map, 3D twin, checks, manual
# changes and the action plan work without a server; the Expert Operator needs the local one.
name: Static demo on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - id: deployment
        uses: actions/deploy-pages@v4
