<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteTwin Portfolio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="ui.css?v=ui-74">
</head>
<body class="portfolio-page">
<header class="topbar">
  <a class="app-brand" href="portfolio.html">SiteTwin <span>3D</span></a>
  <div class="breadcrumb">Portfolio</div>
  <span class="context">Planning simulation</span>
  <label class="contrast-control"><input id="projector" type="checkbox"><span>Projector contrast</span></label>
  <button class="drawer-trigger operator-trigger" data-pane="operator" aria-expanded="false">Operator</button>
  <button class="drawer-trigger inspect-trigger" data-pane="inspect" aria-expanded="false">Inspect</button>
  <button class="start-over" id="startOver" title="Forget all chats, plans and loaded files in this browser">Start over</button>
  <button class="upload-btn" id="loadTwin" title="Load SiteTwin file">Load file</button><input type="file" id="upload" accept=".json,application/json" hidden>
</header>
<div class="layout">
  <!-- Left: the conversation with the Expert Operator -->
  <aside class="chat">
    <header>
      <button class="drawer-close" aria-label="Close Operator">Close</button>
      <div class="brand">Expert Operator <span>Muse Spark Open</span></div>
      <details class="model-details"><summary>Model details</summary><div id="chatModel">Waiting for first response</div></details>
    </header>
    <div id="chatLog" class="log"></div>
    <div class="composer">
      <div class="chips">
        <button class="chip suggest">Which site is most urgent and why?</button>
        <button class="chip suggest">Fix every site that needs action, one by one</button>
        <button class="chip suggest">Hangi sahalarda okul ya da hastane riski var?</button>
      </div>
      <div class="muted composer-status" id="chatBusy" role="status" hidden></div>
      <div class="input-pill">
        <textarea id="chatInput" aria-label="Message to Expert Operator" rows="1" placeholder="Ask about your sites"></textarea>
        <button class="icon-btn" id="micButton" title="Talk" aria-label="Talk"></button>
        <button class="icon-btn send" id="chatSend" title="Send" aria-label="Send"></button>
      </div>
    </div>
  </aside>

  <!-- Right: the map, and the selected site (the panel stays closed with none) -->
  <main class="work">
    <div id="map" class="stage" aria-label="Portfolio map"><div id="loading" class="hud loading-state" role="status">Loading and assessing sites…</div></div>
    <section class="panel cards">
      <div class="panel-top"><button class="drawer-close" aria-label="Close inspector">Close</button></div>

      <section class="card" data-card="selected" hidden>
        <button class="card-head" aria-expanded="true"><span class="card-icon">📍</span><span class="card-title">Selected site</span><span class="card-summary"></span><span class="chev" aria-hidden="true">▾</span></button>
        <div class="card-body" id="selectedSite"></div>
      </section>

      <section class="card" data-card="actions" hidden data-folded>
        <button class="card-head" aria-expanded="true"><span class="card-icon">🕘</span><span class="card-title">Actions taken</span><span class="card-summary"></span><span class="chev" aria-hidden="true">▾</span></button>
        <div class="card-body"><ul id="actions" class="actions"><li class="muted">Nothing yet</li></ul></div>
      </section>
    </section>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<nav class="mobile-nav" aria-label="Workspace navigation"><button data-pane="workspace" aria-pressed="true">Workspace</button><button data-pane="operator" aria-expanded="false">Operator</button><button data-pane="inspect" aria-expanded="false">Inspect</button></nav>
<div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
<div id="liveStatus" class="sr-only" role="status" aria-live="polite"></div>
<script type="module" src="portfolio.js?v=ui-74"></script>
</body>
</html>
